name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skill/a-share-research/requirements.lock

      - name: Install locked runtime dependencies and checkers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skill/a-share-research/requirements.lock
          python -m pip install "ruff" "mypy==1.17.1"

      - name: Offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Ruff check
        run: ruff check --isolated --no-cache --select E4,E7,E9,F .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy strict
        run: mypy --strict skill/a-share-research/scripts
